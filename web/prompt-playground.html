<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section>
      <p class="eyebrow">AI Tools Lab</p>
      <h1>Prompt Playground</h1>
      <p>Write a rough prompt and get a cleaner structured version locally in the browser.</p>
      <textarea id="input" placeholder="Paste your prompt here..."></textarea>
      <button id="clean">Clean prompt</button>
    </section>
    <section class="output">
      <h2>Result</h2>
      <pre id="result">Ready.</pre>
    </section>
  </main>
  <script src="prompt-playground.js"></script>
</body>
</html>
